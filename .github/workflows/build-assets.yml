name: Générer les visuels Nuvio

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_assets.py"
      - ".github/workflows/build-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Pillow
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Créer les JPG GIF et JSON
        run: python scripts/generate_assets.py
      - name: Publier les ressources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ Nuvio-Ultimate-FR.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser les visuels et la collection Nuvio"
            git push
          fi
